[package]
name = "fast-lio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline driver application for FAST-LIO (not published to crates.io)"
publish = false

[features]
default = ["livox-sdk2"]
livox-sdk2 = ["fast-lio-driver/livox-sdk2"]

[dependencies]
fast-lio = { path = "../fast-lio" }
fast-lio-driver = { path = "../fast-lio-driver", features = ["livox-sdk2"] }
ctrlc = "3"
